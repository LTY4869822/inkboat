<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地富文本导入验收</title>
<body style="margin:20px;font-family:system-ui"><h1>本地富文本导入验收</h1><p>选择本次 article.html，再导入隔离编辑区。此页只读取选定的本地文件，不上传；导入通过不代表剪贴板或微信后台通过。</p>
<label>本地排版 HTML <input id="file" type="file" accept=".html,text/html"></label><button id="import" disabled>导入排版 HTML</button><p id="status">尚未选择文件</p>
<div id="editor" contenteditable="true" aria-label="本地富文本编辑区" style="min-height:500px;border:1px solid #aaa;max-width:677px;margin:auto"></div>
<script>
let payload='';
document.querySelector('#file').addEventListener('change',async event=>{
 const file=event.target.files[0]; if(!file)return;
 payload=await file.text();document.querySelector('#import').disabled=false;
 document.querySelector('#status').textContent='已读取 '+file.name+'，'+payload.length+' 字符。';
});
document.querySelector('#import').addEventListener('click',()=>{
 const editor=document.querySelector('#editor');editor.focus();
 const range=document.createRange();range.selectNodeContents(editor);
 const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);
 const ok=document.execCommand('insertHTML',false,payload);
 document.querySelector('#status').textContent=ok?'已通过编辑器插入 HTML，请检查全文与图文。':'浏览器未完成导入';
});
</script></body></html>

<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地富文本导出接收器</title>
<body style="max-width:760px;margin:32px auto;padding:16px;font-family:system-ui">
<h1>本地富文本导出接收器</h1><p>先在周行页面复制最终文章，再点击读取。此页面不联网、不上传、不储存凭证。读取失败时可以在下方区域直接粘贴。</p>
<button id="capture">读取浏览器剪贴板富文本</button><p id="status">尚未读取</p>
<textarea id="html" aria-label="复制出的HTML" style="width:100%;height:180px" readonly></textarea>
<div id="paste" contenteditable="true" aria-label="富文本粘贴区" style="min-height:300px;border:1px solid #aaa;margin-top:20px"></div>
<script>
document.querySelector('#capture').addEventListener('click',async()=>{
try {
 let found=false;
 for(const item of await navigator.clipboard.read()) {
  if(item.types.includes('text/html')) {
   const text=await(await item.getType('text/html')).text();
   document.querySelector('#html').value=text;
   document.querySelector('#status').textContent='已读取 '+text.length+' 字符，请核对当前标题与正文。';
   found=true; break;
  }
 }
 if(!found) document.querySelector('#status').textContent='剪贴板没有 HTML，请重新复制或在粘贴区粘贴。';
}catch(error){document.querySelector('#status').textContent='读取失败：'+error.name+'，可在下方粘贴。';}
});
</script></body></html>
